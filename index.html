<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban-дошка справ</title>

    <link rel="stylesheet" href="./css/style.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="./js/app.js" defer></script>
  </head>

  <body>
    <main id="app" class="container">
      <h1>Моя Kanban-дошка</h1>
      <p class="subtitle">Практична робота №11 | Варіант 11</p>

      <section class="panel">
        <h3>Завантаження задач з API</h3>
        <p class="description">JSONPlaceholder — задачі користувача №3</p>

        <button type="button" @click="loadData" :disabled="loading">
          {{ loading ? "Завантаження..." : "Оновити задачі" }}
        </button>

        <p v-if="successMessage" class="success">{{ successMessage }}</p>

        <p v-if="errorMessage" class="error">{{ errorMessage }}</p>
      </section>

      <section class="panel">
        <h3>Додати нову задачу</h3>

        <form @submit.prevent="addTask" class="task-form">
          <input
            type="text"
            v-model="newTitle"
            placeholder="Назва задачі"
            minlength="3"
            required
          />

          <select v-model="newColumn">
            <option value="todo">To Do</option>
            <option value="doing">In Progress</option>
            <option value="done">Done</option>
          </select>

          <button type="submit" :disabled="loading">Додати</button>
        </form>
      </section>

      <section class="board">
        <div class="column">
          <h3>To Do <span>{{ todoTasks.length }}</span></h3>

          <task-card
            v-for="task in todoTasks"
            :key="task.id"
            :id="task.id"
            :title="task.title"
            :column="task.column"
            :disabled="loading"
            @move-next="moveNext"
            @edit-task="editTask"
            @delete-task="deleteTask"
          ></task-card>
        </div>

        <div class="column">
          <h3>In Progress <span>{{ doingTasks.length }}</span></h3>

          <task-card
            v-for="task in doingTasks"
            :key="task.id"
            :id="task.id"
            :title="task.title"
            :column="task.column"
            :disabled="loading"
            @move-next="moveNext"
            @edit-task="editTask"
            @delete-task="deleteTask"
          ></task-card>
        </div>

        <div class="column">
          <h3>Done <span>{{ doneTasks.length }}</span></h3>

          <task-card
            v-for="task in doneTasks"
            :key="task.id"
            :id="task.id"
            :title="task.title"
            :column="task.column"
            :disabled="loading"
            @move-next="moveNext"
            @edit-task="editTask"
            @delete-task="deleteTask"
          ></task-card>
        </div>
      </section>
    </main>
  </body>
</html>
