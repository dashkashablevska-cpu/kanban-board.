<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Практична №9 — Kanban-дошка</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/app.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Моя Kanban-дошка</h1>
        <p>Практична робота №9 | Варіант 11</p>
      </header>

      <section class="api-section">
        <h2>Завантаження задач з API</h2>
        <p>JSONPlaceholder — задачі користувача №3</p>

        <button id="refreshBtn" type="button">Оновити задачі</button>

        <p id="loading" hidden>Завантаження...</p>
        <p id="errorMessage" class="error" role="alert" hidden></p>
        <p id="successMessage" class="success" role="status" hidden></p>
      </section>

      <section class="form-section">
        <h2>Додати нову задачу</h2>

        <form id="taskForm">
          <input
            type="text"
            id="taskTitle"
            placeholder="Назва задачі"
            minlength="3"
            required
          />

          <select id="taskColumn">
            <option value="todo">To Do</option>
            <option value="progress">In Progress</option>
            <option value="done">Done</option>
          </select>

          <button type="submit">Додати</button>
        </form>
      </section>

      <main class="board">
        <section class="column">
          <h2>To Do <span id="todoCount">0</span></h2>
          <div id="todoList" class="task-list"></div>
        </section>

        <section class="column">
          <h2>In Progress <span id="progressCount">0</span></h2>
          <div id="progressList" class="task-list"></div>
        </section>

        <section class="column">
          <h2>Done <span id="doneCount">0</span></h2>
          <div id="doneList" class="task-list"></div>
        </section>
      </main>
    </div>
  </body>
</html>
